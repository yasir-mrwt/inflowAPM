services:
  # -----------------------------
  # Next.js browser application
  # -----------------------------
  frontend:
    build: ./frontend
    container_name: inflowapm_frontend
    init: true

    ports:
      - "3000:3000"

    environment:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # This value is used by the browser, so it must be host-accessible.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5002

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  # -----------------------------
  # Express API
  # -----------------------------
  api:
    build: ./backend
    container_name: inflowapm_api
    init: true

    ports:
      - "5002:5002"

    env_file:
      - ./backend/.env

    environment:
      PORT: 5002
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/inflowapm_test
      REDIS_URL: redis://redis:6379/0
      TEST_REDIS_URL: redis://redis:6379/1
      CORS_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      GOOGLE_REDIRECT_URI: http://localhost:5002/api/v1/auth/google/callback

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

    command: npx tsx watch src/server.ts

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  # -----------------------------
  # PostgreSQL
  # -----------------------------
  postgres:
    image: postgres:18-alpine
    container_name: inflowapm_postgres
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    expose:
      - "5432"

    volumes:
      - pgdata:/var/lib/postgresql
      - ./backend/docker/init-test-database.sql:/docker-entrypoint-initdb.d/10-init-test-database.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5

  # -----------------------------
  # Redis
  # -----------------------------
  redis:
    image: redis:7-alpine
    container_name: inflowapm_redis
    restart: always

    expose:
      - "6379"

    volumes:
      - redisdata:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
