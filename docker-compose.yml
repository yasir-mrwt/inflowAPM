services:
  # -----------------------------
  # Express API
  # -----------------------------
  api:
    build: ./backend
    container_name: inflowapm_api
    init: true

    ports:
      - "5002:5002"

    env_file:
      - ./backend/.env

    environment:
      PORT: 5002
      NODE_ENV: development

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_started

    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

    command: npx tsx watch src/server.ts

  # -----------------------------
  # PostgreSQL
  # -----------------------------
  postgres:
    image: postgres:18-alpine
    container_name: inflowapm_postgres
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    expose:
      - "5432"

    volumes:
      - pgdata:/var/lib/postgresql
      - ./backend/docker/init-test-database.sql:/docker-entrypoint-initdb.d/10-init-test-database.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5

  # -----------------------------
  # Redis
  # -----------------------------
  redis:
    image: redis:7-alpine
    container_name: inflowapm_redis
    restart: always

    expose:
      - "6379"

    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
