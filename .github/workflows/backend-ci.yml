name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Backend Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inflowapm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test

      PORT: "5002"

      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inflowapm_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inflowapm_test

      REDIS_URL: redis://localhost:6379
      TEST_REDIS_URL: redis://localhost:6379/1

      ACCESS_TOKEN_SECRET: ci-access-token-secret-at-least-32-characters
      REFRESH_TOKEN_SECRET: ci-refresh-token-secret-at-least-32-characters
      JWT_SECRET: ci-jwt-secret-at-least-32-characters
      SESSION_SECRET: ci-session-secret-at-least-32-characters-long

      CORS_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000

      MAIL_ENABLED: "false"

      GOOGLE_CLIENT_ID: test-google-client-id
      GOOGLE_CLIENT_SECRET: test-google-client-secret
      GOOGLE_REDIRECT_URI: http://localhost:5002/api/v1/auth/google/callback

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.x"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high
