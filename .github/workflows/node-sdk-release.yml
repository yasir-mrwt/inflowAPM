name: Node SDK Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    if: startsWith(github.event.release.tag_name, 'node-v')
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js and npm registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Use a trusted-publishing-compatible npm CLI
        run: npm install --global npm@11.19.1

      - name: Install exact dependencies
        run: npm ci

      - name: Verify source, tests, handles, and packed consumers
        run: npm run release:check

      - name: Verify release identity
        run: npm run release:guard

      - name: Publish public package with provenance
        run: npm publish --access public
